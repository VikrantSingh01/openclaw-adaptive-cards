name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 23]
    steps:
      - uses: actions/checkout@v4

      - name: Checkout adaptive-cards-mcp (sibling dependency)
        run: git clone --depth 1 https://github.com/VikrantSingh01/adaptive-cards-mcp.git ../adaptive-cards-mcp

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Build adaptive-cards-mcp core
        working-directory: ../adaptive-cards-mcp/packages/core
        run: npm ci && npm run build

      - run: npm install
      - run: npm run typecheck
      - run: npm test
